[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-posttrain"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Evidence-first medical post-training compatibility diagnostics"
dependencies = []

[project.scripts]
mpt = "medical_posttrain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
